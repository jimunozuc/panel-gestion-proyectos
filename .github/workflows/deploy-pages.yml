name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main, develop, consulta-v1]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consulta-v1 (producción, congelada — panel de consulta original)
        uses: actions/checkout@v4
        with:
          ref: consulta-v1
          path: consulta-src

      - name: Checkout main (app nueva, producción)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Checkout develop (desarrollo)
        uses: actions/checkout@v4
        with:
          ref: develop
          path: dev-src

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (consulta-v1)
        working-directory: consulta-src/frontend
        run: npm ci

      - name: Build consulta-v1 → /
        working-directory: consulta-src/frontend
        run: npm run build
        env:
          NODE_ENV: production
          BASE_PATH: /panel-gestion-proyectos/
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Install deps (main)
        working-directory: main-src/frontend
        run: npm ci

      - name: Build main → /app/
        working-directory: main-src/frontend
        run: npm run build
        env:
          NODE_ENV: production
          BASE_PATH: /panel-gestion-proyectos/app/
          VITE_API_URL: ${{ vars.VITE_API_URL_APP }}

      - name: Install deps (develop)
        working-directory: dev-src/frontend
        run: npm ci

      - name: Build develop → /dev/
        working-directory: dev-src/frontend
        run: npm run build
        env:
          NODE_ENV: production
          BASE_PATH: /panel-gestion-proyectos/dev/
          VITE_API_URL: ${{ vars.VITE_API_URL_DEV }}

      - name: Combinar sitios (consulta en raíz, app nueva en /app/, desarrollo en /dev/)
        run: |
          mkdir -p site/app site/dev
          cp -r consulta-src/frontend/dist/. site/
          cp -r main-src/frontend/dist/. site/app/
          cp -r dev-src/frontend/dist/. site/dev/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
