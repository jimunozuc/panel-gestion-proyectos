services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - REFRESH_SECRET=${REFRESH_SECRET}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
        BASE_PATH: /
    ports:
      - "8080:80"
    depends_on:
      - backend
