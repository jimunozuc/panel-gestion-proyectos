name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: panel
          POSTGRES_PASSWORD: panel
          POSTGRES_DB: panel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Correr tests
        working-directory: backend
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://panel:panel@localhost:5432/panel_test
